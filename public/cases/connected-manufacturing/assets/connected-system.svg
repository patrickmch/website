<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="700" viewBox="0 0 1510 700" role="img" aria-labelledby="title description"><title id="title">The system around a custom job</title><desc id="description">Existing CRM, CAD and ERP remain specialist systems. Delivered intake captures requests and prepares a design brief. Delivered Quote Tool calculates options, saves versions and produces customer and internal views. Shared job history links context, drawings and approved ERP packages. Source-checked reporting supports management review.</desc><rect width="100%" height="100%" fill="#F4F2ED"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6B7682" stroke-width="1.4"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B04A1B" stroke-width="1.4"/></marker></defs><rect x="20" y="25" width="280" height="650" fill="none" stroke="#CFCBC2"/><path d="M20 69 H300" stroke="#CFCBC2"/><text x="40" y="54" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Existing business systems</text><rect x="360" y="25" width="790" height="650" fill="none" stroke="#CFCBC2"/><path d="M360 69 H1150" stroke="#CFCBC2"/><text x="380" y="54" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Company-owned application</text><rect x="1210" y="25" width="280" height="650" fill="none" stroke="#CFCBC2"/><path d="M1210 69 H1490" stroke="#CFCBC2"/><text x="1230" y="54" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Outputs &amp; management views</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="55" y="125" width="210" height="78" rx="2"/></g><te
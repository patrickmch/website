<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="700" viewBox="0 0 1510 700" role="img" aria-labelledby="title description"><title id="title">The system around a custom job</title><desc id="description">Existing CRM, CAD and ERP remain specialist systems. Delivered intake captures requests and prepares a design brief. Delivered Quote Tool calculates options, saves versions and produces customer and internal views. Shared job history links context, drawings and approved ERP packages. Source-checked reporting supports management review.</desc><rect width="100%" height="100%" fill="#F4F2ED"/><defs><marker id="arrow" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="10" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1 L9 6 L2 11" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="20" y="25" width="280" height="650" fill="none" stroke="#CFCBC2"/><path d="M20 65 H300" stroke="#CFCBC2"/><text x="36.0" y="51.0" text-anchor="start" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#3D4854" letter-spacing="0.08em">EXISTING BUSINESS SYSTEMS</text><rect x="360" y="25" width="790" height="650" fill="none" stroke="#CFCBC2"/><path d="M360 65 H1150" stroke="#CFCBC2"/><text x="376.0" y="51.0" text-anchor="start" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#3D4854" letter-spacing="0.08em">COMPANY-OWNED APPLICATION</text><rect x="1210" y="25" width="280" height="650" fill="none" stroke="#CFCBC2"/><path d="M1210 65 H1490" stroke="#CFCBC2"/><text x="1226.0" y="51.0" text-anchor="start" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#3D4854" letter-spacing="0.08em">OUTPUTS &amp; MANAGEMENT VIEWS</text><g fill="#F4F2ED" stroke="#6B7682" stro
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title description"><title id="title">Less repeated work in quoting</title><desc id="description">Earlier: request, retype details, find drawing, rebuild estimate, prepare quote. Changed specifications loop back to drawing and estimating. Delivered quoting: enter details, calculate options, review and revise, generate a customer PDF. Revisions reuse the saved quote and preserve earlier versions.</desc><rect width="100%" height="100%" fill="#F4F2ED"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6B7682" stroke-width="1.4"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B04A1B" stroke-width="1.4"/></marker></defs><text x="30" y="36" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="19" font-weight="600" fill="#16202B">Earlier workflow</text><text x="1130" y="36" text-anchor="end" font-family="Source Sans 3, Arial, sans-serif" font-size="15" font-weight="400" fill="#B04A1B">Repeated entry and reconstruction</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="30" y="65" width="180" height="66" rx="2"/></g><text x="120.0" y="103.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Customer request</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="260" y="65" width="180" height="66" rx="2"/></g><text x="350.0" y="103.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Retype details</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="490" y="65" width="180" height="66" rx="2"/></g><text x="580.0" y="103.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Find current drawing</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="720" y="65" width="180" height="66" rx="2"/></g><text x="810.0" y="103.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Rebuild estimate</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><path d="M950 65 H1112 L1130 83 V131 H950 Z M1112 65 V83 H1130"/></g><text x="1040.0" y="103.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Prepare quote</text><path d="M210 98 H260" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M440 98 H490" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M670 98 H720" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M900 98 H950" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M810 131 V179 H580 V131" fill="none" stroke="#B04A1B" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#orange)"/><rect x="579.25" y="166" width="231.5" height="21" fill="#F4F2ED"/><text x="695" y="181" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#16202B">Spec changed: repeat the work</text><path d="M30 214 H1130" stroke="#CFCBC2"/><text x="30" y="253" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="19" font-weight="600" fill="#16202B">Delivered quoting workflow</text><text x="1130" y="253" text-anchor="end" font-family="Source Sans 3, Arial, sans-serif" font-size="15" font-weight="400" fill="#16202B">Reuse the saved calculation</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="30" y="281" width="220" height="78" rx="2"/></g><text x="140.0" y="311.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Enter job details</text><text x="140.0" y="335.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D4854">Dimensions, material, quantities</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="320" y="281" width="220" height="78" rx="2"/></g><text x="430.0" y="311.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Calculate options</text><text x="430.0" y="335.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D4854">One saved quote</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="610" y="281" width="220" height="78" rx="2"/></g><text x="720.0" y="311.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Review &amp; revise</text><text x="720.0" y="335.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D4854">Keep earlier versions</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><path d="M900 281 H1102 L1120 299 V359 H900 Z M1102 281 V299 H1120"/></g><text x="1010.0" y="311.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Generate customer PDF</text><text x="1010.0" y="335.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D4854">From the reviewed version</text><path d="M250 320 H320" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M540 320 H610" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M830 320 H900" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M720 359 V398 H430 V359" fill="none" stroke="#B04A1B" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#orange)"/><rect x="421.75" y="385" width="306.5" height="21" fill="#F4F2ED"/><text x="575" y="400" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#16202B">Revise the record; preserve the history</text></svg>
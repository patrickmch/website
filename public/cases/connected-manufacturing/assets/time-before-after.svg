<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title description"><title id="title">Less repeated work in quoting</title><desc id="description">Earlier: request, retype details, find drawing, rebuild estimate, prepare quote. Changed specifications loop back to drawing and estimating. Delivered quoting: enter details, calculate options, review and revise, generate a customer PDF. Revisions reuse the saved quote and preserve earlier versions.</desc><rect width="100%" height="100%" fill="#F4F2ED"/><defs><marker id="arrow" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="10" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1 L9 6 L2 11" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="30.0" y="38.0" text-anchor="start" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#3D4854" letter-spacing="0.08em">EARLIER WORKFLOW</text><text x="1130.0" y="38.0" text-anchor="end" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#B04A1B">Repeated entry and reconstruction</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="30.0" y="64" width="162.4" height="56" rx="2"/></g><text x="111.2" y="96.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Customer request</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="266.5" y="64" width="145.6" height="56" rx="2"/></g><text x="339.3" y="96.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Retype details</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="486.2" y="64" width="196.0" height="56" rx="2"/></g><text x="584.2" y="96.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Find current drawing</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="756.3" y="64" width="162.4" height="56" rx="2"/></g><text x="837.5" y="96.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Rebuild estimate</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="992.8" y="64" width="137.2" height="56" rx="2"/></g><text x="1061.4" y="96.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Prepare quote</text><path d="M192.4 92.0 H266.5" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M412.1 92.0 H486.2" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M682.2 92.0 H756.3" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M918.7 92.0 H992.8" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M837.5 120 V160 H584.2 V120" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="591.8" y="151" width="238.2" height="18" fill="#F4F2ED"/><text x="710.9" y="164.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#B04A1B">Spec changed: repeat the work</text><path d="M30 206 H1130" stroke="#CFCBC2"/><text x="30.0" y="246.0" text-anchor="start" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#3D4854" letter-spacing="0.08em">DELIVERED QUOTING WORKFLOW</text><text x="1130.0" y="246.0" text-anchor="end" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#2F6A4A">Reuse the saved calculation</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="30.0" y="272" width="230.0" height="78" rx="2"/></g><text x="145.0" y="296.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Enter job details</text><text x="145.0" y="317.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3D4854">Dimensions, material,</text><text x="145.0" y="334.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3D4854">quantities</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="320.0" y="272" width="230.0" height="78" rx="2"/></g><text x="435.0" y="292.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#3D4854" letter-spacing="0.1em">AUTOMATIC</text><text x="435.0" y="314.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Calculate options</text><text x="435.0" y="335.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3D4854">One saved quote</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="610.0" y="272" width="230.0" height="78" rx="2"/></g><text x="725.0" y="292.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#3D4854" letter-spacing="0.1em">ESTIMATING</text><text x="725.0" y="314.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Review &amp; revise</text><text x="725.0" y="335.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3D4854">Keep earlier versions</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="900.0" y="272" width="230.0" height="78" rx="2"/></g><text x="1015.0" y="292.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#3D4854" letter-spacing="0.1em">AUTOMATIC</text><text x="1015.0" y="314.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Generate customer PDF</text><text x="1015.0" y="335.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3D4854">From the reviewed version</text><path d="M260.0 311.0 H320.0" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M550.0 311.0 H610.0" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M840.0 311.0 H900.0" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M725.0 350 V390 H435.0 V350" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="421.9" y="381" width="316.2" height="18" fill="#F4F2ED"/><text x="580.0" y="394.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#B04A1B">Revise the record; preserve the history</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="500" viewBox="0 0 1360 500" role="img" aria-labelledby="title description"><title id="title">Handle changes without rebuilding the job</title><desc id="description">A customer changes a dimension. A person decides whether the drawing is affected. If yes, engineering checks and updates it; if no, estimating proceeds. Reprice options, save the next quote version, review and send a PDF from that version. The app alerts the next owner. Further changes return to the same job and retain earlier versions.</desc><rect width="100%" height="100%" fill="#F4F2ED"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#6B7682" stroke-width="1.4"/></marker><marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B04A1B" stroke-width="1.4"/></marker></defs><text x="30" y="36" text-anchor="start" font-family="Source Sans 3, Arial, sans-serif" font-size="20" font-weight="600" fill="#16202B">A specification change through the delivered app</text><text x="1330" y="36" text-anchor="end" font-family="Source Sans 3, Arial, sans-serif" font-size="15" font-weight="400" fill="#16202B">Specification-change example</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="30" y="85" width="190" height="90" rx="2"/></g><text x="125.0" y="124.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Customer changes</text><text x="125.0" y="147.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">a dimension</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><polygon points="345.0,85 430,130.0 345.0,175 260,130.0"/></g><text x="345.0" y="124.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Drawing</text><text x="345.0" y="147.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">affected?</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="585" y="85" width="210" height="90" rx="2"/></g><text x="690.0" y="121.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Reprice the options</text><text x="690.0" y="145.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D4854">Estimating</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="875" y="85" width="200" height="90" rx="2"/></g><text x="975.0" y="121.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Save next version</text><text x="975.0" y="145.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D4854">Quote Tool</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="1145" y="85" width="190" height="90" rx="2"/></g><text x="1240.0" y="121.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Review &amp; send</text><text x="1240.0" y="145.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D4854">Sales</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="250" y="300" width="190" height="90" rx="2"/></g><text x="345.0" y="336.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Check the design</text><text x="345.0" y="360.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D4854">Engineering</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="500" y="300" width="210" height="90" rx="2"/></g><text x="605.0" y="336.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Update drawing</text><text x="605.0" y="360.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D4854">Engineering</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><rect x="875" y="300" width="200" height="90" rx="2"/></g><text x="975.0" y="336.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Alert next owner</text><text x="975.0" y="360.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D4854">Automated notification</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5"><path d="M1145 300 H1317 L1335 318 V390 H1145 Z M1317 300 V318 H1335"/></g><text x="1240.0" y="336.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="18" font-weight="600" fill="#16202B">Customer PDF</text><text x="1240.0" y="360.0" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#3D4854">Saved quote version</text><path d="M220 130 H260" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M430 130 H585" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="485.5" y="96" width="29.0" height="21" fill="#F4F2ED"/><text x="500" y="111" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#16202B">No</text><path d="M345 175 V300" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="346.75" y="229" width="36.5" height="21" fill="#F4F2ED"/><text x="365" y="244" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#16202B">Yes</text><path d="M440 345 H500" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M710 345 H750 V175" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><rect x="694.25" y="239" width="111.5" height="21" fill="#F4F2ED"/><text x="750" y="254" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#16202B">Reviewed spec</text><path d="M795 130 H875" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M1075 130 H1145" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M1240 175 V300" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M975 175 V300" fill="none" stroke="#6B7682" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#arrow)"/><path d="M1240 390 V465 H125 V175" fill="none" stroke="#B04A1B" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="none" marker-end="url(#orange)"/><rect x="373.0" y="452" width="614.0" height="21" fill="#F4F2ED"/><text x="680" y="467" text-anchor="middle" font-family="Source Sans 3, Arial, sans-serif" font-size="14" font-weight="400" fill="#16202B">Another customer change? Return to the same job and retain the previous version.</text></svg>
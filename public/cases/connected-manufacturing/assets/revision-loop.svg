<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="500" viewBox="0 0 1360 500" role="img" aria-labelledby="title description"><title id="title">Handle changes without rebuilding the job</title><desc id="description">A customer changes a dimension. A person decides whether the drawing is affected. If yes, engineering checks and updates it; if no, estimating proceeds. Reprice options, save the next quote version, review and send a PDF from that version. The app alerts the next owner. Further changes return to the same job and retain earlier versions.</desc><rect width="100%" height="100%" fill="#F4F2ED"/><defs><marker id="arrow" viewBox="0 0 10 12" refX="9" refY="6" markerWidth="10" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1 L9 6 L2 11" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="30.0" y="38.0" text-anchor="start" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#3D4854" letter-spacing="0.08em">A SPECIFICATION CHANGE THROUGH THE DELIVERED APP</text><text x="1330.0" y="38.0" text-anchor="end" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3D4854">Specification-change example</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="30.0" y="85" width="190.0" height="90" rx="2"/></g><text x="125.0" y="125.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Customer changes</text><text x="125.0" y="143.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">a dimension</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><polygon points="345.0,85 430.0,130.0 345.0,175.0 260.0,130.0"/></g><text x="345.0" y="125.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Drawing</text><text x="345.0" y="143.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">affected?</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="585.0" y="85" width="210.0" height="90" rx="2"/></g><text x="690.0" y="121.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#3D4854" letter-spacing="0.1em">ESTIMATING</text><text x="690.0" y="143.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Reprice the options</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="875.0" y="85" width="200.0" height="90" rx="2"/></g><text x="975.0" y="121.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#3D4854" letter-spacing="0.1em">QUOTE TOOL</text><text x="975.0" y="143.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Save next version</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="1145.0" y="85" width="190.0" height="90" rx="2"/></g><text x="1240.0" y="121.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#3D4854" letter-spacing="0.1em">SALES</text><text x="1240.0" y="143.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Review &amp; send</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="250.0" y="300" width="190.0" height="90" rx="2"/></g><text x="345.0" y="336.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#3D4854" letter-spacing="0.1em">ENGINEERING</text><text x="345.0" y="358.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Check the design</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="500.0" y="300" width="210.0" height="90" rx="2"/></g><text x="605.0" y="336.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#3D4854" letter-spacing="0.1em">ENGINEERING</text><text x="605.0" y="358.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Update drawing</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="875.0" y="300" width="200.0" height="90" rx="2"/></g><text x="975.0" y="326.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="500" fill="#3D4854" letter-spacing="0.1em">AUTOMATIC</text><text x="975.0" y="348.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Alert next owner</text><text x="975.0" y="369.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3D4854">notification</text><g fill="#F4F2ED" stroke="#6B7682" stroke-width="1.5" stroke-linejoin="round"><rect x="1145.0" y="300" width="190.0" height="90" rx="2"/></g><text x="1240.0" y="338.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="500" fill="#16202B">Customer PDF</text><text x="1240.0" y="359.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3D4854">Saved quote version</text><path d="M220.0 130.0 H260.0" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M430.0 130.0 H585.0" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="493.7" y="107.0" width="27.6" height="18" fill="#F4F2ED"/><text x="507.5" y="120.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3D4854">No</text><path d="M345.0 175.0 V300.0" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="351.3" y="228.5" width="35.4" height="18" fill="#F4F2ED"/><text x="369.0" y="241.5" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3D4854">Yes</text><path d="M440.0 345.0 H500.0" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M710.0 345.0 H750 V175" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="693.3" y="251.0" width="113.4" height="18" fill="#F4F2ED"/><text x="750.0" y="264.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#3D4854">Reviewed spec</text><path d="M795.0 130.0 H875.0" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1075.0 130.0 H1145.0" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1240.0 175.0 V300.0" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M975.0 175.0 V300.0" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1240.0 390 V465 H125.0 V175" fill="none" stroke="#6B7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="362.0" y="456" width="636.0" height="18" fill="#F4F2ED"/><text x="680.0" y="469.0" text-anchor="middle" font-family="'Source Code Pro', ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="500" fill="#B04A1B">Another customer change? Return to the same job and retain the previous version.</text></svg>
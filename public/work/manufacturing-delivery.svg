<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">From business rules to tested software</title><desc id="desc">Business judgment feeds implementation, independent verification, corrections and release review. Reporting is reconciled against source transactions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#166f73" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18334b}.title{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.label{font-size:16px;font-weight:700}</style><rect width="1100" height="590" fill="#fff"/><text x="24" y="35" class="title" text-anchor="start">From business rules to tested software</text><text x="24" y="64" class="body" text-anchor="start">Software delivery and reporting both start with the meaning of the work.</text><rect x="24" y="106" width="230" height="110" rx="7" fill="#fcf0e8" stroke="#9a451f" stroke-width="1.4"/><text x="40" y="134" class="label" text-anchor="start">Business judgment</text><text x="40" y="159" class="small" text-anchor="start">Rules + real examples</text><text x="40" y="180" class="small" text-anchor="start">Priorities + acceptance</text><text x="40" y="201" class="small" text-anchor="start">Resolve ambiguity</text><rect x="309" y="106" width="208" height="110" rx="7" fill="#eaf3f3" stroke="#166f73" stroke-width="1.4"/><text x="325" y="134" class="label" text-anchor="start">Implementation</text><text x="325" y="159" class="small" text-anchor="start">Bounded specification</text><text x="325" y="180" class="small" text-anchor="start">AI-assisted build</text><text x="325" y="201" class="small" text-anchor="start">Repeatable code checks</text><rect x="572" y="106" width="230" height="110" rx="7" fill="#eaf3f3" stroke="#166f73" stroke-width="1.4"/><text x="588" y="134" class="label" text-anchor="start">Independent verification</text><text x="588" y="159" class="small" text-anchor="start">Browser-based QA</text><text x="588" y="180" class="small" text-anchor="start">Evidence + code review</text><text x="588" y="201" class="small" text-anchor="start">Failures remain visible</text><rect x="857" y="106" width="219" height="110" rx="7" fill="#fcf0e8" stroke="#9a451f" stroke-width="1.4"/><text x="873" y="134" class="label" text-anchor="start">Release + operator review</text><text x="873" y="159" class="small" text-anchor="start">Review tested change</text><text x="873" y="180" class="small" text-anchor="start">Authorized release</text><text x="873" y="201" class="small" text-anchor="start">Feedback from use</text><path d="M254 161 H309" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><path d="M517 161 H572" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><path d="M802 161 H857" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><path d="M687 216 V266 H413 V216" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="253" class="small" text-anchor="middle">Correct and retest</text><path d="M966 216 V310 H139 V216" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="553" y="301" class="small" text-anchor="middle">Operator feedback informs the next requirement</text><text x="24" y="371" class="label" text-anchor="start">Reporting: connect the numbers to what happened</text><rect x="24" y="397" width="270" height="112" rx="7" fill="#eaf3f3" stroke="#166f73" stroke-width="1.4"/><text x="40" y="425" class="label" text-anchor="start">Source transactions</text><text x="40" y="450" class="small" text-anchor="start">Trace the report population</text><text x="40" y="471" class="small" text-anchor="start">Check omissions + timing</text><rect x="413" y="397" width="270" height="112" rx="7" fill="#eaf3f3" stroke="#166f73" stroke-width="1.4"/><text x="429" y="425" class="label" text-anchor="start">Definitions + corrections</text><text x="429" y="450" class="small" text-anchor="start">Agree what is being measured</text><text x="429" y="471" class="small" text-anchor="start">Repair and reconcile logic</text><rect x="802" y="397" width="274" height="112" rx="7" fill="#fcf0e8" stroke="#9a451f" stroke-width="1.4"/><text x="818" y="425" class="label" text-anchor="start">Management information</text><text x="818" y="450" class="small" text-anchor="start">Figures traceable to source</text><text x="818" y="471" class="small" text-anchor="start">Known gaps made explicit</text><path d="M294 451 H413" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><path d="M683 451 H802" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="560" class="small" text-anchor="start">People define the business rules and acceptance criteria. Findings feed back into the next iteration.</text></svg>
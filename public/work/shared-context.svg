<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Shared context, useful work</title><desc id="desc">Staff access shared context through MCP. Source tools feed ingestion. Workflow instructions also use direct authorized connectors for current documents.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#166f73" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#18334b}.title{font-size:21px;font-weight:700}.body{font-size:16px}.small{font-size:14px}.label{font-size:16px;font-weight:700}</style><rect width="1100" height="610" fill="#fff"/><text x="24" y="35" class="title" text-anchor="start">Shared context, useful work</text><text x="24" y="64" class="body" text-anchor="start">A simplified view of the system and the workflows it supports.</text><rect x="24" y="116" width="195" height="92" rx="7" fill="#fcf0e8" stroke="#9a451f" stroke-width="1.4"/><text x="40" y="144" class="label" text-anchor="start">Staff + AI workspace</text><text x="40" y="169" class="small" text-anchor="start">Ask a question</text><text x="40" y="190" class="small" text-anchor="start">Start a workflow</text><rect x="274" y="116" width="192" height="92" rx="7" fill="#eaf3f3" stroke="#166f73" stroke-width="1.4"/><text x="290" y="144" class="label" text-anchor="start">Controlled connection</text><text x="290" y="169" class="small" text-anchor="start">MCP tools</text><text x="290" y="190" class="small" text-anchor="start">Access-scoped queries</text><rect x="522" y="100" width="234" height="124" rx="7" fill="#eaf3f3" stroke="#166f73" stroke-width="1.4"/><text x="538" y="128" class="label" text-anchor="start">Shared context</text><text x="538" y="153" class="small" text-anchor="start">Related records</text><text x="538" y="174" class="small" text-anchor="start">Source references</text><text x="538" y="195" class="small" text-anchor="start">Unresolved facts retained</text><rect x="823" y="100" width="246" height="124" rx="7" fill="#eaf3f3" stroke="#166f73" stroke-width="1.4"/><text x="839" y="128" class="label" text-anchor="start">Collection + validation</text><text x="839" y="153" class="small" text-anchor="start">Collect source records</text><text x="839" y="174" class="small" text-anchor="start">Match related information</text><text x="839" y="195" class="small" text-anchor="start">Prepare queryable views</text><path d="M219 162 H274" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><path d="M466 162 H522" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><path d="M823 162 H756" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><rect x="823" y="284" width="246" height="116" rx="7" fill="#eaf3f3" stroke="#166f73" stroke-width="1.4"/><text x="839" y="312" class="label" text-anchor="start">Existing business tools</text><text x="839" y="337" class="small" text-anchor="start">Operational records</text><text x="839" y="358" class="small" text-anchor="start">Customer records</text><text x="839" y="379" class="small" text-anchor="start">Documents + web records</text><path d="M946 284 V224" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="285" width="296" height="135" rx="7" fill="#eaf3f3" stroke="#166f73" stroke-width="1.4"/><text x="40" y="313" class="label" text-anchor="start">Reusable workflow instructions</text><text x="40" y="338" class="small" text-anchor="start">Assemble a profile</text><text x="40" y="359" class="small" text-anchor="start">Prepare recurring documents</text><text x="40" y="380" class="small" text-anchor="start">Check supporting evidence</text><path d="M122 285 V208" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><path d="M320 349 H823" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="380" y="334" class="small" text-anchor="start">Direct authorized retrieval</text><text x="380" y="374" class="small" text-anchor="start">For current documents and task-specific evidence</text><rect x="454" y="456" width="350" height="94" rx="7" fill="#fcf0e8" stroke="#9a451f" stroke-width="1.4"/><text x="470" y="484" class="label" text-anchor="start">Human review + decision</text><text x="470" y="509" class="small" text-anchor="start">Check the output and its sources</text><text x="470" y="530" class="small" text-anchor="start">Resolve exceptions; approve the next action</text><path d="M172 420 V502 H454" fill="none" stroke="#166f73" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="586" class="small" text-anchor="start">The shared store supplies context. Authorized source connections supply current supporting documents.</text></svg>